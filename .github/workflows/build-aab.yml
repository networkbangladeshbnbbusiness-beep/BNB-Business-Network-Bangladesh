name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -f "public/keystore_b64.txt" ] && [ -s "public/keystore_b64.txt" ]; then
            echo "Found public/keystore_b64.txt, restoring original release keystore..."
            node -e 'const fs = require("fs"); const b64 = fs.readFileSync("public/keystore_b64.txt", "utf8").trim().replace(/\s+/g, ""); fs.writeFileSync("android/app/release.keystore", Buffer.from(b64, "base64"));'
          elif [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub secrets..."
            node -e 'const fs = require("fs"); const b64 = (process.env.RELEASE_KEYSTORE_BASE64 || "").trim().replace(/\s+/g, ""); fs.writeFileSync("android/app/release.keystore", Buffer.from(b64, "base64"));'
          elif [ -f "android/app/release.keystore" ]; then
            echo "Found existing android/app/release.keystore."
          else
            echo "Generating fallback release keystore with alias almayadin..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias almayadin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 \
              -storepass almayadin123 -keypass almayadin123 \
              -dname "CN=BNB Bangladesh, OU=BNB, O=BNB, L=Dhaka, ST=Dhaka, C=BD"
          fi

      - name: Build Release AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'almayadin123' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'almayadin' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'almayadin123' }}
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew bundleRelease --stacktrace || gradle bundleRelease --stacktrace

      - name: Sign AAB with jarsigner
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "android/app/release.keystore" ]; then
            echo "Signing $AAB_FILE..."
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore android/app/release.keystore \
              -storepass "almayadin123" \
              -keypass "almayadin123" \
              "$AAB_FILE" "almayadin" || true
            
            echo "Verifying signed AAB..."
            jarsigner -verify "$AAB_FILE" || true
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bnb-business-network-v3-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
