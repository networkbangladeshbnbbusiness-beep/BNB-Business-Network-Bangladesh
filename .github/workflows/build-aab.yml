name: Build Signed Android AAB (Google Play Store)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build Signed Android App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Required Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Official Green BNB App Icons
        run: node scripts/generate-official-icons.mjs

      - name: Build Web Production Bundle
        run: |
          rm -rf public/assets/aistudio
          npm run build
          rm -rf dist/assets/aistudio

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Release Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Loading keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          elif [ ! -f android/app/release.keystore ] || [ ! -s android/app/release.keystore ]; then
            echo "Generating fallback release.keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore -alias almayadin -keypass almayadin123 -storepass almayadin123 -validity 10000 -dname "CN=BNB BUSINESS Network Bangladesh, O=BNB, C=BD" -keyalg RSA -keysize 2048 -storetype PKCS12
          fi
          echo "=== Keystore Certificate SHA-1 & SHA-256 ==="
          keytool -list -v -keystore android/app/release.keystore -storepass almayadin123 || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Signed AAB (Bundle Release) & APK
        run: |
          cd android
          echo "=== Building Signed Android App Bundle (.aab) & APK ==="
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Prepare AAB & APK Artifacts with Unique Versioned Filenames
        run: |
          mkdir -p final-artifacts apk-only aab-only
          VERSION_CODE=$(grep -m1 "versionCode" android/app/build.gradle | awk '{print $2}' | tr -d '\r\n' || echo "release")
          BUILD_TAG="v${VERSION_CODE}-run${GITHUB_RUN_NUMBER}"
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} "final-artifacts/BNB-BUSINESS-Network-Bangladesh-${BUILD_TAG}.aab" \; || true
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} "final-artifacts/BNB-BUSINESS-Network-Bangladesh-${BUILD_TAG}.apk" \; || true
          cp final-artifacts/*.aab aab-only/ 2>/dev/null || true
          cp final-artifacts/*.apk apk-only/ 2>/dev/null || true
          ls -lh final-artifacts/

      - name: Upload AAB & APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Release-AAB
          path: final-artifacts/*
          compression-level: 6
          retention-days: 30

      - name: Upload Direct APK Only Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Installable-APK
          path: apk-only/*
          compression-level: 6
          retention-days: 30
