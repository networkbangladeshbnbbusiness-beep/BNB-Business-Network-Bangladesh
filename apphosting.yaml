# Firebase App Hosting configuration for BNB Business Network Bangladesh
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 5
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
  - variable: FIRESTORE_DATABASE_ID
    value: ai-studio-120ec6e1-2db5-45d2-b1b1-46493400c959
