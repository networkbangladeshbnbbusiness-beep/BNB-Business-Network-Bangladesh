    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;width:100%;background-color:#0b6623;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;color:#ffffff;padding:24px;box-sizing:border-box;text-align:center;">
        <img src="/app_icon.png" alt="BNB Official Logo" style="width:96px;height:96px;border-radius:20px;object-fit:contain;box-shadow:0 12px 30px rgba(0,0,0,0.25);margin-bottom:16px;" />
        <div style="font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:0.2px;">

          BNB Business Network Bangladesh
        </div>
        <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.25);border-top-color:#fbbf24;border-radius:50%;animation:bnbInitSpin 0.8s linear infinite;"></div>
        <style>@keyframes bnbInitSpin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
