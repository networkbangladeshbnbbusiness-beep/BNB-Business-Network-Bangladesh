    <meta property="og:title" content="BNB BUSINESS network Bangladesh" />
    <meta property="og:description" content="BNB BUSINESS network Bangladesh - সমবায় সমিতি ও ডিজিটাল বিজনেস নেটওয়ার্ক পোর্টাল" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        background-color: #ffffff !important;
      }
      html, body {
        background-color: #ffffff !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100%;
        width: 100%;
      }
      /* Single Unified Splash Screen: Displays immediately on startup, prevents blank flashes */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: opacity 0.35s ease-out;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash img {
        width: 190px;
        height: 190px;
        max-width: 65vw;
        max-height: 65vw;
        object-fit: contain;
      }
    </style>
    <script>
      (function() {
        var startTime = Date.now();
        var MIN_SPLASH_TIME = 1200; // 1.2s smooth presentation
        var isDismissed = false;

        window.__hideAppSplash = function() {
          if (isDismissed) return;
          isDismissed = true;
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);
          setTimeout(function() {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.classList.add('splash-hidden');
              setTimeout(function() {
                if (splash && splash.parentNode) {
                  splash.parentNode.removeChild(splash);
                }
              }, 400);
            }
          }, remaining);
        };

        // Fallback timer: guarantees splash screen smoothly clears after 3s even if network is slow
        setTimeout(function() {
          if (!isDismissed && window.__hideAppSplash) {
            window.__hideAppSplash();
          }
        }, 3000);
      })();
    </script>
  </head>
  <body style="background-color: #ffffff; margin: 0; padding: 0;">
    <div id="app-splash">
      <img src="/bnb_logo.png" alt="BNB Logo" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
